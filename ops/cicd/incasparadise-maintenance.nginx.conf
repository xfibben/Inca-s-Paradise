# Pantalla temporal durante un despliegue del frontend.
# Este fragmento se incluye dentro del servidor HTTPS de incasparadise.com.
if (-f /home/adminip/conf/web/incasparadise.com/.frontend-deploying) {
    return 503;
}

error_page 503 = @incasparadise_frontend_updating;

location @incasparadise_frontend_updating {
    internal;
    root /home/adminip/web/incasparadise.com/public_html;
    try_files /frontend-updating.html =500;
}
