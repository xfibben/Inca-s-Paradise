<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Inca's Paradise · Actualizando</title>
    <style>
      :root {
        --teal: #13aaa0;
        --teal-dark: #087d76;
        --gold: #f5c52b;
        --ink: #26323a;
        --sand: #f8f4ee;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 14%, rgba(19, 170, 160, .12), transparent 25rem),
          radial-gradient(circle at 90% 88%, rgba(245, 197, 43, .16), transparent 23rem),
          var(--sand);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(92vw, 39rem);
        padding: clamp(2.5rem, 8vw, 5.25rem) clamp(1.5rem, 7vw, 4.5rem);
        text-align: center;
        background: rgba(255, 255, 255, .88);
        border: 1px solid rgba(19, 170, 160, .14);
        border-radius: 1.75rem;
        box-shadow: 0 1.5rem 4rem rgba(38, 50, 58, .12);
      }

      .mark {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.6rem;
        display: grid;
        place-items: center;
        border-radius: 1.5rem;
        background: linear-gradient(145deg, var(--teal), #20c9b8);
        box-shadow: 0 .75rem 1.8rem rgba(19, 170, 160, .24);
      }

      .mark svg { width: 3.7rem; height: 3.7rem; }

      .eyebrow {
        margin: 0 0 .75rem;
        color: var(--teal-dark);
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-style: italic;
        font-weight: 500;
        line-height: 1.08;
      }

      p {
        max-width: 31rem;
        margin: 1.15rem auto 0;
        color: #52616a;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.6;
      }

      .progress {
        width: min(100%, 17rem);
        height: .3rem;
        margin: 2.15rem auto 0;
        overflow: hidden;
        border-radius: 99px;
        background: #dce9e7;
      }

      .progress::after {
        content: '';
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--teal), var(--gold));
        animation: advance 1.45s ease-in-out infinite;
      }

      .note {
        margin-top: 1.1rem;
        color: #738087;
        font-size: .82rem;
      }

      @keyframes advance {
        from { transform: translateX(-120%); }
        to { transform: translateX(310%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after { animation: none; transform: translateX(70%); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 22V17C22 11.5 42 11.5 42 17V22" stroke="#F5C52B" stroke-width="5" stroke-linecap="round" />
          <rect x="12" y="21" width="40" height="31" rx="7" fill="#FFFFFF" fill-opacity=".2" stroke="#FFFFFF" stroke-width="3" />
          <path d="M16 47L26 35L32 41L38 31L49 47" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="eyebrow">Inca's Paradise</p>
      <h1>Estamos actualizando tu próxima aventura.</h1>
      <p>Estamos preparando algunos detalles para ofrecerte una experiencia aún mejor. Volveremos en unos instantes.</p>
      <div class="progress" aria-label="Actualización en progreso"></div>
      <p class="note">We’ll be back shortly.</p>
    </main>
  </body>
</html>
